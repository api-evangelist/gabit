name: Gabit
description: 'Gabit is a one-stop health and wellness platform on a mission to add
  more healthy years to people''s lives. Headquartered in Gurugram, India and founded
  in 2022 by Gaurav Gupta (ex-Zomato cofounder) and Arpana Shahi, Gabit treats health
  as an interconnected system across four pillars — fitness, nutrition, sleep, and
  mindfulness. Its consumer ecosystem spans the titanium Gabit Smart Ring, a smart
  body-composition scale, at-home Blood Work diagnostics, a continuous glucose monitor
  (CGM), the Sweden-born Näck nutrition supplement line, all-good-no-harm skincare,
  and coached Fitness & Nutrition Plans — all unified in the Gabit app, which tracks
  150+ biomarkers and includes the free PEP AI health coach. India is the primary
  market, with Ring-only storefronts in the UAE and UK and an informational US/global
  page.'
